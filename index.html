  ];
  const $=(s,root=document)=>root.querySelector(s); const $$=(s,root=document)=>[...root.querySelectorAll(s)];
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const format=n=>Number(n).toLocaleString('ru-RU');
  const getStore=(key,fallback)=>{try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch{return fallback}};
  const setStore=(key,val)=>{try{localStorage.setItem(key,JSON.stringify(val))}catch{}};
  const state={screen:'home',selected:'programming',grade:5,format:'quest',filter:'all',search:'',sort:'popular',favorites:new Set(getStore('sb-faves',[])),history:getStore('sb-history',[]),reviews:getStore('sb-reviews',[]),accountTab:'overview',mobileOpen:false,alias:'',latest:null,modal:null,motion:getStore('sb-motion',true),contrast:getStore('sb-contrast',false)};

  const cloudConfig=window.SEREGA_AUTH||{};
  const cloudEnabled=Boolean(cloudConfig.url&&cloudConfig.anonKey);
  let cloudClient=null,authUser=null;
  const accountKeys=['sb-faves','sb-history','sb-reviews','sb-motion','sb-contrast'];

  function uget(key,fallback){return getStore(userKey(key),fallback);}
  function uset(key,value){setStore(userKey(key),value);}
  function loadWorkspace(){state.favorites=new Set(uget('sb-faves',[]));state.history=uget('sb-history',[]);state.reviews=uget('sb-reviews',[]);state.motion=uget('sb-motion',true);state.contrast=uget('sb-contrast',false);document.body.classList.toggle('no-motion',!state.motion);document.body.classList.toggle('high-contrast',state.contrast);}
  function publicLocalUser(acc){return {id:'local-'+acc.id,name:acc.name,email:acc.email};}
  function localUsers(){return getStore('sb-auth-accounts',[]);}
  function restoreLocalUser(){if(cloudEnabled)return;const saved=getStore('sb-auth-session',null);const found=localUsers().find(x=>x.id===saved);authUser=found?publicLocalUser(found):null;loadWorkspace();}
  const bytesToHex=bytes=>Array.from(new Uint8Array(bytes)).map(x=>x.toString(16).padStart(2,'0')).join('');
  const hexToBytes=hex=>new Uint8Array(hex.match(/.{1,2}/g).map(x=>parseInt(x,16)));
  async function derivePassword(pass,salt){
    if(!globalThis.crypto?.subtle)throw Error('Для регистрации откройте сайт по HTTPS или через localhost.');
    const input=new TextEncoder().encode(pass);
    const material=await crypto.subtle.importKey('raw',input,'PBKDF2',false,['deriveBits']);
    const hash=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:220000,hash:'SHA-256'},material,256);

  async function localSignUp(email,password,name){
    const users=localUsers();

  }

    const user=localUsers().find(x=>x.email===email);
    const error='Неверная почта или пароль.';
    if(!user)throw Error(error);
    const hash=await derivePassword(password,hexToBytes(user.salt));
    let mismatch=hash.length!==user.hash.length?1:0;
    for(let i=0;i<Math.min(hash.length,user.hash.length);i++)mismatch|=hash.charCodeAt(i)^user.hash.charCodeAt(i);
    if(mismatch!==0)throw Error(error);
    setStore('sb-auth-session',user.id);authUser=publicLocalUser(user);loadWorkspace();
  }
  async function initCloudAuth(){
    if(!cloudEnabled)return;
    try{
      const lib=await import('https://esm.sh/@supabase/supabase-js@2');
      cloudClient=lib.createClient(cloudConfig.url,cloudConfig.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      const {data,error}=await cloudClient.auth.getSession();
      if(error)throw error;
      applyCloudSession(data.session);
      cloudClient.auth.onAuthStateChange((_type,session)=>{applyCloudSession(session);render();});
      render();
    }catch(err){console.error('Auth configuration error',err);notify('Сервис входа недоступен. Проверьте auth-config.js и подключение к интернету.');}
  }
  function applyCloudSession(session){
    authUser=session?.user?{id:'cloud-'+session.user.id,name:session.user.user_metadata?.display_name||session.user.email?.split('@')[0]||'Студент',email:session.user.email||''}:null;
    loadWorkspace();

  async function submitAuth(form){
    const email=String(form.elements.email.value).trim().toLowerCase();
    const password=String(form.elements.password.value);
    const signup=state.modal==='register';
    if(password.length<8)throw Error('Пароль должен содержать не менее 8 символов.');
    if(signup){
      const name=String(form.elements.displayName.value).trim();
      if(name.length<2)throw Error('Введите имя или никнейм от 2 символов.');
      if(password!==String(form.elements.confirm.value))throw Error('Пароли не совпадают.');
      if(cloudEnabled){
        if(!cloudClient)throw Error('Сервис регистрации ещё не подключён. Проверьте настройки Supabase.');
        const {data,error}=await cloudClient.auth.signUp({email,password,options:{data:{display_name:name},emailRedirectTo:new URL('./',location.href).href}});
        if(error)throw error;
        if(!data.session){state.modal='login';render();notify('Письмо для подтверждения регистрации отправлено на email.');return;}
        applyCloudSession(data.session);
      }else await localSignUp(email,password,name);
    }else if(cloudEnabled){
      if(!cloudClient)throw Error('Сервис входа ещё не подключён. Проверьте настройки Supabase.');
      const {data,error}=await cloudClient.auth.signInWithPassword({email,password});
      if(error)throw Error(error.message||'Не удалось войти.');
      applyCloudSession(data.session);
    }else await localSignIn(email,password);
    state.modal=null;state.accountTab='overview';go('dashboard');notify(signup?'Регистрация завершена. Добро пожаловать!':'Вы вошли в аккаунт.');
  }

  let content='';
  const name=esc(authUser.name||'Студент');
  if(state.accountTab==='overview')content=`<div class="eyebrow">Личный кабинет</div><h1 class="page-title">Привет, ${name}!</h1><p class="muted">Здесь хранятся избранные предметы и история прохождений.</p><div class="stats"><div class="stat"><div class="note">Результатов</div><b>${state.history.length}</b><span class="note">в истории</span></div><div class="stat"><div class="note">Предметов</div><b>${state.favorites.size}</b><span class="note">избранное</span></div><div class="stat"><div class="note">Баллов всего</div><b>${format(state.history.reduce((t,x)=>t+Number(x.points||0),0))} ◇</b><span class="note">виртуальная валюта</span></div></div><h2>Последние результаты</h2>${historyRows()}<div style="margin-top:20px"><button class="button" data-page="catalog">Выбрать ещё предмет →</button></div>`;
  if(state.accountTab==='history')content=`<div class="eyebrow">Мои результаты</div><h1 class="page-title">История сценариев</h1><p class="muted">Сохраняется в браузере для текущего аккаунта.</p>${historyRows()}<div style="margin-top:20px;display:flex;gap:12px;flex-wrap:wrap"><button class="button secondary" data-action="export">Экспортировать JSON ↓</button><button class="button secondary" data-action="clear-history" ${state.history.length?'':'disabled'}>Очистить историю</button></div>`;
  if(state.accountTab==='favorites')content=`<div class="eyebrow">Избранное</div><h1 class="page-title">Сохранённые дисциплины</h1><p class="muted">Нажимайте сердечко на карточке, чтобы убрать её из списка.</p>${cards(subjects.filter(x=>state.favorites.has(x.id)))}<div style="margin-top:20px"><button class="button secondary" data-page="catalog">Перейти к каталогу →</button></div>`;
  if(state.accountTab==='settings')content=`<div class="eyebrow">Настройки интерфейса</div><h1 class="page-title">Мои настройки</h1><section class="panel" style="max-width:620px"><label class="checks"><input type="checkbox" id="motion-option" ${state.motion?'checked':''}><span><b>Анимации интерфейса</b></span></label><label class="checks"><input type="checkbox" id="contrast-option" ${state.contrast?'checked':''}><span><b>Повышенный контраст</b></span></label><button class="button secondary" data-action="clear-all">Сбросить историю и настройки</button><p class="help">Удаляются данные выбранного аккаунта только на этом устройстве.</p></section>`;
  return `<main class="shell account-grid"><aside class="account-side"><div style="font-weight:900;margin:5px 7px 15px">Серега башляет</div>${accountMenu()}</aside><div class="account-main"><div class="account-userbar"><div class="account-greeting"><div class="account-avatar">${esc((authUser.name||'?').slice(0,1).toUpperCase())}</div><div><strong>${name}</strong><div class="account-meta">${esc(authUser.email)}</div></div></div><button class="button secondary small" data-action="logout">Выйти из аккаунта</button></div>${content}</div></main>`;
}
  function result(){const x=state.latest||{subject:currentSubject().name,grade:state.grade,code:'SB-00042',points:totalPoints(),date:new Date().toLocaleDateString('ru-RU')};return `<main class="shell"><div class="result-wrap"><div class="result-card"><div class="check">✓</div><div class="eyebrow">Сценарий завершён</div><h1>Сдать экзамен<br>«за взятку» нельзя</h1><p class="lead">Но можно получить сувенирный итог вымышленного квеста: <b>${esc(x.subject)}, оценка ${x.grade}</b>. Настоящих оплат и оценок нет.</p><div class="receipt"><b>Ваш игровой билет:</b> ${esc(x.code)}<br>Игровая стоимость: ${format(x.points)} ◇ · Дата: ${esc(x.date)}<br>Никакой юридической силы документ не имеет.</div><div class="result-actions"><button class="button" data-action="download">Скачать сувенирный билет ↓</button><button class="button secondary" data-action="copy">Скопировать код</button><button class="button secondary" data-page="dashboard">В кабинет →</button></div><div style="margin-top:16px"><button class="link" data-page="catalog">Выбрать другой предмет</button></div></div></div></main>`}
  function dialog(){
  if(!state.modal)return '';
  if(state.modal==='login'||state.modal==='register'){
    const signup=state.modal==='register';
    return `<div class="shade" data-action="backdrop"><div class="dialog auth-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><button class="close" data-action="close" aria-label="Закрыть">×</button><div class="eyebrow">Серега башляет</div><h2 id="dialog-title">${signup?'Регистрация':'Вход в аккаунт'}</h2><p class="auth-subtitle">${signup?'Создай свой профиль и сохраняй достижения.':'Войди, чтобы открыть личный кабинет.'}</p><form id="auth-form" autocomplete="on">${signup?`<div class="form-row"><label class="form-label" for="auth-name">Имя или никнейм</label><input id="auth-name" class="input" name="displayName" type="text" maxlength="50" minlength="2" placeholder="Серега" autocomplete="nickname" required></div>`:''}<div class="form-row"><label class="form-label" for="auth-email">Электронная почта</label><input class="input" id="auth-email" name="email" type="email" maxlength="200" placeholder="name@example.com" autocomplete="email" required></div><div class="form-row"><label class="form-label" for="auth-password">Пароль</label><input class="input" id="auth-password" name="password" type="password" minlength="8" maxlength="128" autocomplete="${signup?'new-password':'current-password'}" placeholder="Не менее 8 символов" required></div>${signup?`<div class="form-row"><label class="form-label" for="auth-confirm">Повторите пароль</label><input class="input" id="auth-confirm" name="confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Повторите пароль" required></div>`:''}<div id="auth-error" role="alert" aria-live="polite"></div><button class="button full auth-login-submit" type="submit" id="auth-submit">${signup?'Зарегистрироваться':'Войти'}</button></form><div class="auth-switch">${signup?'Уже есть аккаунт?':'Нет аккаунта?'} <button type="button" class="link" data-action="${signup?'login':'register'}">${signup?'Войти':'Регистрация'}</button></div><div class="auth-footer">${cloudEnabled?'Аккаунт с подтверждением электронной почты.':'Данные аккаунта доступны в этом браузере.'}</div></div></div>`;
  }
  if(state.modal==='simulate')return `<div class="shade" data-action="backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><button class="close" data-action="close" aria-label="Закрыть">×</button><div class="eyebrow">Оформление сценария</div><h2 id="dialog-title">Подтвердите выбор</h2><p class="muted">Предмет: <b>${esc(currentSubject().name)}</b> · оценка ${state.grade} · ${format(totalPoints())} ◇.</p><form id="simulate-form"><div class="form-row"><label class="form-label" for="alias">Имя персонажа</label><input class="input" id="alias" name="alias" placeholder="Например, Суперстудент" maxlength="40" required autocomplete="off" value="${esc(state.alias)}"></div><div id="dialog-error" aria-live="polite"></div><button type="submit" class="button full">Получить результат →</button></form></div></div>`;
  return '';
}
  function page(){switch(state.screen){case 'catalog':return catalog();case 'detail':case 'modal':return detail();case 'how':return how();case 'reviews':return reviews();case 'about':return about();case 'dashboard':return account();case 'success':return result();default:return home();}}
  function render(){document.title=`Серега башляет — ${({'home':'Главная','catalog':'Каталог экзаменов','detail':'Предмет','how':'Как это работает','reviews':'Отзывы','about':'О проекте','dashboard':'Кабинет','success':'Результат'})[state.screen]||'Интерактивный учебный проект'}`;$('#app').innerHTML=header()+page()+footer();$('#dialog-root').innerHTML=dialog();if(state.modal){document.body.style.overflow='hidden';setTimeout(()=>{if(state.modal==='simulate')$('#alias')?.focus();else if(state.modal==='register')$('#auth-name')?.focus();else if(state.modal==='login')$('#auth-email')?.focus();else $('.dialog .button')?.focus()},10)}else document.body.style.overflow='';}
  function updateCatalog(){const dest=$('#catalog-list');if(dest)dest.innerHTML=cards(catalogFilter());}
  function openModal(which){state.modal=which;render();}
  function closeModal(){state.modal=null;state.alias='';render();}
  function toggleFave(id){if(state.favorites.has(id))state.favorites.delete(id);else state.favorites.add(id);uset('sb-faves',[...state.favorites]);notify(state.favorites.has(id)?'Предмет добавлен в избранное':'Предмет удалён из избранного');render();}
  function simulateResult(){const x=currentSubject();const code='SB-'+Math.floor(10000+Math.random()*90000);const data={subject:x.name,grade:state.grade,code,points:totalPoints(),date:new Date().toLocaleDateString('ru-RU')};state.latest=data;state.history=[data,...state.history].slice(0,30);uset('sb-history',state.history);state.modal=null;state.alias='';go('success');notify('Сценарий завершён. ');}
  function makeDownload(name,content,mime='text/plain;charset=utf-8'){const blob=new Blob([content],{type:mime});const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),2000)}
  async function copyCode(){const x=state.latest||{code:'SB-00042'};try{await navigator.clipboard.writeText(x.code);notify('Код скопирован: '+x.code)}catch{const i=document.createElement('textarea');i.value=x.code;document.body.append(i);i.select();document.execCommand('copy');i.remove();notify('Код скопирован: '+x.code)}}
  function download(){const x=state.latest||{subject:currentSubject().name,grade:state.grade,code:'SB-00042',points:totalPoints(),date:new Date().toLocaleDateString('ru-RU')};makeDownload('serega-bashlyaet-ticket.txt',`СЕРЕГА БАШЛЯЕТ — СУВЕНИРНЫЙ БИЛЕТ\n\nКод: ${x.code}\nПредмет: ${x.subject}\nВымышленная оценка: ${x.grade}\nИгровые фантики: ${x.points}\nДата: ${x.date}\n\nЭто пародия. Не является документом об образовании.\nРеальной оплаты или передачи данных не было.\n`);notify('Сувенирный билет скачан')}
  document.addEventListener('click',e=>{
    const open=e.target.closest('[data-page]');if(open){e.preventDefault();closeModalSilent();go(open.dataset.page);return;}
    const subject=e.target.closest('[data-detail]');if(subject){state.selected=subject.dataset.detail;state.grade=5;e.preventDefault();go('detail',{subject:state.selected});return;}
    const fave=e.target.closest('[data-fave]');if(fave){toggleFave(fave.dataset.fave);return;}
    const filt=e.target.closest('[data-filter]');if(filt){state.filter=filt.dataset.filter;render();return;}
    const tab=e.target.closest('[data-tab]');if(tab){state.accountTab=tab.dataset.tab;render();return;}
    const btn=e.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action;
    if(action==='backdrop'){if(e.target===btn)closeModal();return;}
    if(action==='close'){closeModal();return;}
    if(action==='menu'){state.mobileOpen=!state.mobileOpen;render();return;}
    if(action==='login'){openModal('login');return;}
    if(action==='register'){openModal('register');return;}
    if(action==='logout'){logOut();return;}
    if(action==='open-account'){state.modal=null;state.accountTab='overview';go('dashboard');return;}
    if(action==='simulate'){openModal('simulate');return;}
    if(action==='download'){download();return;}
    if(action==='copy'){copyCode();return;}
    if(action==='reset-filters'){state.filter='all';state.search='';state.sort='popular';render();return;}
    if(action==='export'){makeDownload('serega-bashlyaet-history.json',JSON.stringify(state.history,null,2),'application/json;charset=utf-8');notify('Локальная история скачана');return;}
    if(action==='clear-history'){if(confirm('Удалить историю игровых сценариев в этом браузере?')){state.history=[];uset('sb-history',[]);render();notify('История очищена')}return;}
    if(action==='clear-all'){if(confirm('Удалить историю, избранное, отзывы и настройки?')){state.favorites.clear();state.history=[];state.reviews=[];state.motion=true;state.contrast=false;accountKeys.forEach(k=>{try{localStorage.removeItem(userKey(k))}catch{}});document.body.classList.remove('no-motion','high-contrast');render();notify('Локальные данные сброшены')}return;}
  });
  function closeModalSilent(){state.modal=null;state.alias='';}
  document.addEventListener('input',e=>{if(e.target.id==='catalog-search'){state.search=e.target.value;updateCatalog()}if(e.target.id==='alias')state.alias=e.target.value;});
  document.addEventListener('change',e=>{if(e.target.id==='catalog-sort'){state.sort=e.target.value;updateCatalog()};if(e.target.id==='grade-select'){state.grade=Number(e.target.value);$('#points-value').textContent=format(totalPoints())+' ◇'};if(e.target.id==='format-select')state.format=e.target.value;if(e.target.id==='motion-option'){state.motion=e.target.checked;document.body.classList.toggle('no-motion',!state.motion);uset('sb-motion',state.motion);notify('Настройка анимаций сохранена')};if(e.target.id==='contrast-option'){state.contrast=e.target.checked;document.body.classList.toggle('high-contrast',state.contrast);uset('sb-contrast',state.contrast);notify('Настройка контраста сохранена')}});
  document.addEventListener('submit',e=>{
    if(e.target.id==='auth-form'){
      e.preventDefault();const form=e.target,button=form.querySelector('#auth-submit'),err=form.querySelector('#auth-error');
      button.disabled=true;button.textContent='Проверяем...';err.textContent='';
      submitAuth(form).catch(error=>{if(err)err.innerHTML=`<div class="form-error">${esc(error.message||'Ошибка регистрации')}</div>`;}).finally(()=>{if(button.isConnected){button.disabled=false;button.textContent=state.modal==='register'?'Зарегистрироваться':'Войти';}});
      return;
    }

    if(e.target.id==='simulate-form'){e.preventDefault();const f=e.target;const alias=String(f.elements.alias.value).trim();if(alias.length<2){$('#dialog-error').innerHTML='<div class="form-error">Введите хотя бы 2 символа имени персонажа.</div>';return;}simulateResult();return;}
    if(e.target.id==='review-form'){e.preventDefault();const f=e.target;const name=String(f.elements.name.value).trim(),comment=String(f.elements.text.value).trim(),rating=Number(f.elements.rating.value);if(name.length<2||comment.length<5){notify('Введите псевдоним и отзыв не короче 5 символов');return;}state.reviews.unshift({name,text:comment,rating:Math.min(5,Math.max(1,rating))});state.reviews=state.reviews.slice(0,20);uset('sb-reviews',state.reviews);render();notify('Игровой отзыв опубликован локально');return;}
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal()});
  window.addEventListener('popstate',()=>{const qs=new URLSearchParams(location.search);state.screen=qs.get('screen')||'home';state.selected=qs.get('subject')||state.selected;state.modal=state.screen==='modal'?'simulate':null;if(state.screen==='modal')state.screen='detail';render()});
  const qs=new URLSearchParams(location.search);state.screen=qs.get('screen')||'home';state.selected=qs.get('subject')||'programming';if(state.screen==='modal'){state.screen='detail';state.modal='simulate'}if(state.screen==='tablet'||state.screen==='mobile')state.screen='home';render();initCloudAuth();
  </script>
</body>
</html>
